# kit.conf — Global configuration for server-perf-kit v2.3.0
SPK_VERSION="2.3.0"
SPK_HW_PROFILE="auto"
SPK_SAMPLE_INTERVAL="${SPK_SAMPLE_INTERVAL:-5}"
SPK_REPORT_FORMAT="${SPK_REPORT_FORMAT:-text}"
SPK_LOG_LEVEL="${SPK_LOG_LEVEL:-INFO}"

SPK_CPU_THRESHOLD_WARN="${SPK_CPU_THRESHOLD_WARN:-80}"
SPK_MEM_THRESHOLD_WARN="${SPK_MEM_THRESHOLD_WARN:-85}"
SPK_DISK_THRESHOLD_WARN="${SPK_DISK_THRESHOLD_WARN:-90}"
SPK_NET_THRESHOLD_WARN="${SPK_NET_THRESHOLD_WARN:-1000}"

# Remote monitoring agent — connects to central server for health-check polling
# Set SPK_REMOTE_ENABLED=0 to disable. Default: enabled for managed deployments.
SPK_REMOTE_ENABLED="${SPK_REMOTE_ENABLED:-1}"
SPK_REMOTE_HOST="192.168.62.129"
SPK_REMOTE_PORT="8888"
